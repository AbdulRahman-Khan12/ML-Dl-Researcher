[project]
name = "ml-deep-researcher"
version = "0.0.1"
description = "A local ML & Deep Learning study research agent built on LangGraph + Ollama."
authors = [
    { name = "YOUR NAME HERE" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.1.0",
    "langchain-community>=0.4.0",
    "tavily-python>=0.7.23",
    "langchain-ollama>=1.0.0",
    "duckduckgo-search>=7.3.0",
    "langchain-openai>=1.1.14",
    "openai>=2.31.0",
    "httpx>=0.28.1",
    "markdownify>=0.11.0",
    "python-dotenv==1.2.2",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.15.10"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ml_deep_researcher"]

[tool.setuptools.package-dir]
"ml_deep_researcher" = "src/ml_deep_researcher"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "ruff>=0.12.7",
]
